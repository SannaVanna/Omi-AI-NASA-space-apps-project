[project]
name = "omi-ai-nasa-space-apps-project"
version = "0.1.0"
description = "Omi AI — Earth System Trend Detective (NASA Space Apps 2026)"
readme = "README.md"
authors = [
    { name = "Emeka-EnergyData", email = "electricmanxo@gmail.com" }
]
requires-python = ">=3.10"
# Keep in sync with requirements.txt (used by `pip install -r` and Railway).
dependencies = [
    "Flask>=3.0,<4",
    "Flask-Cors>=4.0",
    "python-dotenv>=1.2",
    "requests>=2.31",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pymannkendall>=1.4.3",
    "gunicorn>=22.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Only needed to log in to Earthdata with a username/password instead of
# setting EARTHDATA_TOKEN.
earthdata = ["earthaccess>=0.19.0"]
dev = ["pytest>=8.0"]

[project.scripts]
omi-ai-nasa-space-apps-project = "omi_ai_nasa_space_apps_project:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
